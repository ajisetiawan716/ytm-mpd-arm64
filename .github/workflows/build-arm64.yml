name: Build yt-mpd ARM64 Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4

      - name: Set Lowercase Owner Name
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Clone ytm-mpd, Apply Patches & Build
        run: |
          git clone https://github.com/dgalli1/ytm-mpd.git ./ytm-mpd-src
          
          # Injeksi Patch menggunakan Node.js
          cat << 'PATCH_EOF' > patch.js
          const fs = require('fs');
          const file = './ytm-mpd-src/src/player/MpdPlayer.ts';
          let code = fs.readFileSync(file, 'utf8');
          
          // 1. Modifikasi format yt-dlp agar mendukung fitur seek
          code = code.replace(/yt-dlp -f bestaudio\[ext=m4a\]/g, 'yt-dlp -f bestaudio -g --format-sort res,abr');
          
          // 2. Injeksi Metadata Judul dan Artis (Bypass TypeScript Strict Typing)
          const target = "await this.client.api.queue.add(audioUrl);";
          const replacement = `await this.client.api.queue.add(audioUrl);
          try {
              const qStatus = await this.client.api.status.get() as any;
              const songPos = qStatus.playlistlength ? (parseInt(qStatus.playlistlength) - 1) : 0;
              const songInfo = await this.client.sendCommand("playlistinfo " + songPos);
              const idMatch = songInfo.match(/Id: (\\d+)/);
              if(idMatch && idMatch[1]) {
                  const songId = idMatch[1];
                  const v = video as any;
                  const title = v.title ? String(v.title).replace(/"/g, '') : 'YouTube Audio';
                  const artist = v.author ? String(v.author).replace(/"/g, '') : 'YouTube';
                  await this.client.sendCommand("addtagid " + songId + ' Title "' + title + '"');
                  await this.client.sendCommand("addtagid " + songId + ' Artist "' + artist + '"');
              }
          } catch(e) {
              console.log("Gagal injeksi tag: " + (e as any).message);
          }`;
          
          code = code.replace(target, replacement);
          fs.writeFileSync(file, code);
          PATCH_EOF
          
          # Eksekusi patch
          node patch.js
          
          # Pembuatan Dockerfile
          cat << 'EOF' > ./ytm-mpd-src/Dockerfile
          FROM node:lts-bookworm-slim
          
          RUN apt-get update && apt-get install -y git python3 make g++ curl wget && rm -rf /var/lib/apt/lists/*
          
          RUN curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && \
              chmod a+rx /usr/local/bin/yt-dlp && \
              ln -s /usr/local/bin/yt-dlp /usr/local/bin/youtube-dl
              
          WORKDIR /app
          COPY package*.json ./
          
          RUN rm -f package-lock.json && npm install youtubei.js@latest yt-cast-receiver@latest
          RUN npm install
          
          COPY . .
          RUN npm run build
          CMD ["node", "dist/index.js"]
          EOF

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push yt-mpd (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: ./ytm-mpd-src
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER }}/ytm-mpd:arm64
          
