name: Build yt-mpd ARM64 Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4

      - name: Set Lowercase Owner Name
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Clone ytm-mpd, Rewrite doPlay & Build
        run: |
          git clone https://github.com/dgalli1/ytm-mpd.git ./ytm-mpd-src
          
          cat << 'PATCH_EOF' > patch.js
          const fs = require('fs');
          const file = './ytm-mpd-src/src/player/MpdPlayer.ts';
          let code = fs.readFileSync(file, 'utf8');
          
          // Regex untuk menemukan blok fungsi doPlay bawaan
          const doPlayRegex = /protected async doPlay\([\s\S]*?return true;\s*\n*\s*\}/m;
          
          // Tulis ulang seluruh fungsi doPlay tanpa menggunakan require()
          const newDoPlay = `protected async doPlay(video: any, position: number): Promise<boolean> {
              console.log("Play " + video.id + " at position " + position + "s");
              this.lastPlayBackCommand = 'NOTHING';
              
              let audioUrl = "";
              let title = "YouTube Audio";
              let artist = "YouTube";
              
              try {
                  // Gunakan exec() yang sudah di-import di awal file MpdPlayer.ts
                  const cmd = 'yt-dlp -f bestaudio --format-sort res,abr --print "%(url)s_||_%(title)s_||_%(channel)s" "https://www.youtube.com/watch?v=' + video.id + '"';
                  
                  const stdout = await new Promise<string>((resolve, reject) => {
                      exec(cmd, (err, stdout, stderr) => {
                          if(err) reject(err);
                          else resolve(stdout);
                      });
                  });
                  
                  const parts = stdout.trim().split('_||_');
                  
                  if (parts.length >= 3) {
                      audioUrl = parts[0];
                      title = parts[1].replace(/"/g, '\\"');
                      artist = parts[2].replace(/"/g, '\\"');
                  } else {
                      audioUrl = await (this as any).getAudioUrl(video);
                  }
              } catch (e) {
                  console.log("Metadata Fetch Error: " + (e as any).message);
                  audioUrl = await (this as any).getAudioUrl(video);
              }

              await this.client.api.queue.clear();
              await this.client.api.queue.add(audioUrl);
              
              try {
                  const qStatus = await this.client.api.status.get() as any;
                  const songPos = qStatus.playlistlength ? (parseInt(qStatus.playlistlength) - 1) : 0;
                  const songInfo = await this.client.sendCommand("playlistinfo " + songPos);
                  const idMatch = songInfo.match(/Id: (\\d+)/);
                  if(idMatch && idMatch[1]) {
                      const songId = idMatch[1];
                      await this.client.sendCommand("addtagid " + songId + ' Title "' + title + '"');
                      await this.client.sendCommand("addtagid " + songId + ' Artist "' + artist + '"');
                  }
              } catch(e) {
                  console.log("Tag inject error: " + (e as any).message);
              }

              await this.client.api.playback.play();
              await this.client.api.playback.seekcur(position.toString());
              this.lastPlayBackCommand = 'PLAY';
              return true;
          }`;
          
          code = code.replace(doPlayRegex, newDoPlay);
          fs.writeFileSync(file, code);
          PATCH_EOF
          
          node patch.js
          
          cat << 'EOF' > ./ytm-mpd-src/Dockerfile
          FROM node:lts-bookworm-slim
          RUN apt-get update && apt-get install -y git python3 make g++ curl wget && rm -rf /var/lib/apt/lists/*
          RUN curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && \
              chmod a+rx /usr/local/bin/yt-dlp && \
              ln -s /usr/local/bin/yt-dlp /usr/local/bin/youtube-dl
          WORKDIR /app
          COPY package*.json ./
          RUN rm -f package-lock.json && npm install youtubei.js@latest yt-cast-receiver@latest
          RUN npm install
          COPY . .
          RUN npm run build
          CMD ["node", "dist/index.js"]
          EOF

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push yt-mpd (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: ./ytm-mpd-src
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER }}/ytm-mpd:arm64
          
