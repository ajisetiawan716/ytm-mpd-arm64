name: Build ARM64 Images

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4

      - name: Set Lowercase Owner Name
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # CLONE DAN PERBAIKI BUG QEMU ALPINE
      - name: Clone ytm-mpd Source Code & Fix QEMU Bug
        run: |
          git clone https://github.com/dgalli1/ytm-mpd.git ./ytm-mpd-src
          # Mengubah image node:alpine menjadi node:bookworm-slim agar npm ci tidak crash
          sed -i 's/alpine/bookworm-slim/g' ./ytm-mpd-src/Dockerfile

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ytm-mpd (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: ./ytm-mpd-src
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER }}/ytm-mpd:arm64

      - name: Build and Push mpd (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.mpd
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER }}/mpd-alpine:arm64
          
