music_directory     "/var/lib/mpd/data"
playlist_directory  "/var/lib/mpd/data/playlists"
db_file             "/var/lib/mpd/data/tag_cache"
state_file          "/var/lib/mpd/data/state"
bind_to_address     "0.0.0.0"
port                "6600"

audio_output {
    type        "httpd"
    name        "HTTP Stream"
    encoder     "lame"
    port        "8000"
    bitrate     "128"
    format      "44100:16:2"
    always_on   "yes"
    tags        "yes"
}

audio_output {
    type        "alsa"
    name        "ALSA Soundcard"
    mixer_type  "software"
  }
